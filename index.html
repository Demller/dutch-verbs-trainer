<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dutch Verbs">
<meta name="format-detection" content="telephone=no">
<title>Dutch Irregular Verbs — 24h Trainer</title>
<style>
:root {
  --bg:#f5f6f8; --card:#fff; --text:#17191c; --muted:#69707a; --line:#e4e7eb;
  --ok:#147a3d; --bad:#b42318; --warn:#9a6700; --accent:#2457d6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
.wrap{max-width:820px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:10;background:rgba(245,246,248,.94);backdrop-filter:blur(10px);padding:10px 0 12px}
h1{font-size:22px;margin:0 0 8px} .sub{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center}
.stat b{display:block;font-size:18px} .stat span{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:7px;overflow:auto;padding:9px 0}
button,.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:12px;padding:12px 14px;font-weight:650;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button.primary{background:var(--accent);color:white;border-color:var(--accent)}
button.good{background:#eef8f2;color:var(--ok);border-color:#bfe3cb}
button.bad{background:#fff1f0;color:var(--bad);border-color:#f4b9b4}
button.active{outline:2px solid var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:9px;box-shadow:0 3px 14px rgba(0,0,0,.04)}
.prompt{font-size:24px;font-weight:800;margin:2px 0 4px}
.hint{color:var(--muted);font-size:13px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}
input,select{width:100%;font-size:17px;border:1px solid #ccd2da;border-radius:12px;padding:13px 12px;background:#fff;min-height:48px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px} .aux-group{display:flex;gap:8px;flex-wrap:wrap}.aux-btn.selected{background:var(--accent);color:#fff;border-color:var(--accent);outline:2px solid rgba(36,87,214,.18)}
.feedback{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.row{padding:6px 0;border-bottom:1px dashed var(--line)} .row:last-child{border-bottom:0}
.ok{color:var(--ok);font-weight:700} .wrong{color:var(--bad);font-weight:700}
.answer{font-weight:750}
.learn-table{width:100%;border-collapse:collapse;font-size:14px}
.learn-table th,.learn-table td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.family{font-weight:800;color:var(--accent);margin-top:18px}
.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#eef1f5;font-size:11px;margin-right:4px}
.small{font-size:12px;color:var(--muted)}
.hidden{display:none!important}
.progressbar{height:8px;background:#e6e9ee;border-radius:999px;overflow:hidden;margin-top:8px}
.progressbar>div{height:100%;background:var(--accent);width:0%}

.mobile-nav{display:none}
@supports(padding:max(0px)){
  .wrap{padding-bottom:max(80px, calc(80px + env(safe-area-inset-bottom)))}
}
@media(max-width:560px){
 .mobile-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
 .mobile-nav button{min-width:0;flex:initial;padding:11px 4px;font-size:12px;border-radius:10px}
 .tabs{display:none}

 .wrap{padding:9px 9px 70px} h1{font-size:19px} .stats{grid-template-columns:repeat(2,1fr)}
 .grid{grid-template-columns:1fr} .prompt{font-size:22px} button{flex:1;min-width:120px}
 .learn-table{font-size:12px} .learn-table th:nth-child(5),.learn-table td:nth-child(5){display:none}
}

.meaning-direction{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}
.meaning-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meaning-option{min-height:58px;text-align:left;font-size:16px}
.meaning-option.correct{border-color:#168a42;background:#eef9f2}
.meaning-option.wrong{border-color:#cc3232;background:#fff1f1}
.pattern-note{font-size:13px;color:var(--muted);margin:4px 0 12px}
.pattern-select{margin-top:10px}
@media(max-width:560px){.meaning-options{grid-template-columns:1fr}}


@media(max-width:560px){
  #meaningView{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
  #meaningView .actions{margin-bottom:8px}
}

</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>🇳🇱 Неправильные глаголы — интенсив 24 часа</h1>
  <div class="sub">149 глаголов · формы · перевод · hulpwerkwoord · спряжение: ik / hij-zij / wij / zij</div>
  <div class="stats">
    <div class="stat"><b id="sMastered">0</b><span>выучено</span></div>
    <div class="stat"><b id="sLearning">0</b><span>в процессе</span></div>
    <div class="stat"><b id="sWeak">0</b><span>слабые</span></div>
    <div class="stat"><b id="sAnswered">0</b><span>ответов</span></div>
  </div>
  <div class="progressbar"><div id="bar"></div></div>
</header>

<div class="tabs">
  <button id="tabPractice" class="active">Тренировка</button>
  <button id="tabLearn">Учить</button>
  <button id="tabMeaning">Значения</button>
  <button id="tabWeak">Слабые</button>
  <button id="tabExam">Экзамен</button>
  <button id="resetBtn">Сброс</button>
</div>

<section id="practiceView">
  <div class="card">
    <div class="small" id="modeLabel">Смешанная тренировка</div>
    <div class="prompt" id="prompt"></div>
    <div class="hint" id="promptHint"></div>

    <div id="fields" class="grid"></div>

    <div class="actions">
      <button class="primary" id="checkBtn">Проверить</button>
      <button id="dontKnowBtn">Не знаю</button>
      <button id="nextBtn" class="hidden">Следующий</button>
    </div>
    <div id="feedback" class="feedback hidden"></div>
  </div>

  <div class="card">
    <div><b>Режим вопроса</b></div>
    <div class="actions">
      <button data-q="mixed" class="q active">Смешанный</button>
      <button data-q="forms" class="q">Формы</button>
      <button data-q="present" class="q">Спряжение</button>
      <button data-q="aux" class="q">hebben / zijn</button>
      <button data-q="meaning" class="q">Значение</button>
      <button data-q="reverse" class="q">Русский → всё</button>
    </div>
  </div>
</section>


<section id="meaningView" class="hidden">
  <div class="card">
    <div class="small">Отдельный модуль: только значение</div>
    <div class="prompt" id="meaningPrompt">—</div>
    <div class="meaning-direction">
      <button class="meaning-dir active" data-dir="nl-ru">NL → RU</button>
      <button class="meaning-dir" data-dir="ru-nl">RU → NL</button>
    </div>
    <div id="meaningOptions" class="meaning-options"></div>
    <div id="meaningFeedback" class="feedback hidden"></div>
    <div class="actions"><button id="meaningNext" class="primary">Следующий</button></div>
  </div>
</section>

<section id="learnView" class="hidden">
  <div class="card">
    <input id="search" placeholder="Поиск: nemen / принимать / spreken">
    <select id="patternFilter" class="pattern-select">
      <option value="">Все семьи изменений</option>
    </select>
    <div class="actions">
      <button id="groupFamily" class="active">По типу изменения</button>
      <button id="groupAlpha">По алфавиту</button>
    </div>
  </div>
  <div id="learnList"></div>
</section>
</div>

 'e → a → o','ij → ee → e','i → o → o','i → a → e','e → a → e',
 'ie → oo → o','ui → oo → o','a → i → a','aa → oe → aa','oo → ie → oo',
 'a → ie → a','ou → ie → ou','aa → o → aa','aa → i → aa','ie → a → ie',
 'oe → ee → aa','e → o → o','oe → o → o','e → ie → o','ee → oo → oo',
 'oo → ocht → ocht','eng → acht → acht','enk → acht → acht',
 'heb → had → gehad','kan → kon → gekund','mag → mocht → gemogen','moet → moest → gemoeten',
 'ee → a → o','oe → ie → oe','regelmatig/afwijkend','aparte vorm'
];
function populatePatternFilter(){
 const sel=$('#patternFilter'); if(!sel) return;
 [...new Set(VERBS.map(v=>v.pattern_group))].sort((a,b)=>{
   const ia=PATTERN_ORDER.indexOf(a), ib=PATTERN_ORDER.indexOf(b);
   return (ia<0?999:ia)-(ib<0?999:ib)||a.localeCompare(b);
 }).forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g;sel.appendChild(o);});
}
let meaningDirection='nl-ru', meaningCurrent=null;
function firstMeaning(v){return (v.translation||'').split(';')[0].trim();}
function newMeaningQuestion(){
 meaningCurrent=VERBS[Math.floor(Math.random()*VERBS.length)];
 const nlru=meaningDirection==='nl-ru';
 $('#meaningPrompt').textContent=nlru?meaningCurrent.infinitive:firstMeaning(meaningCurrent);
 const correct=nlru?meaningCurrent.translation:meaningCurrent.infinitive;
 const distractors=[];
 for(const v of [...VERBS].sort(()=>Math.random()-.5)){
   const x=nlru?v.translation:v.infinitive;
   if(v.id!==meaningCurrent.id && x!==correct && !distractors.includes(x)) distractors.push(x);
   if(distractors.length===3) break;
 }
 const options=[correct,...distractors].sort(()=>Math.random()-.5);
 $('#meaningOptions').innerHTML='';
 $('#meaningFeedback').classList.add('hidden');
 options.forEach(x=>{
   const b=document.createElement('button'); b.className='meaning-option'; b.textContent=x;
   b.onclick=()=>{
     [...$('#meaningOptions').querySelectorAll('button')].forEach(z=>z.disabled=true);
     const ok=x===correct; b.classList.add(ok?'correct':'wrong');
     if(!ok){
       [...$('#meaningOptions').querySelectorAll('button')].find(z=>z.textContent===correct)?.classList.add('correct');
     }
     $('#meaningFeedback').innerHTML=ok?'✓ Верно':'Правильный ответ: <b>'+correct+'</b>';
     $('#meaningFeedback').classList.remove('hidden');
   };
   $('#meaningOptions').appendChild(b);
 });
}

function selectAuxButton(btn){{
  const group=btn.closest('.aux-group');
  if(!group) return;
  group.querySelectorAll('.aux-btn').forEach(b=>{{
    b.classList.remove('selected');
    b.setAttribute('aria-pressed','false');
  }});
  btn.classList.add('selected');
  btn.setAttribute('aria-pressed','true');
  group.dataset.selected=btn.dataset.value;
}}
document.addEventListener('click', function(e){{
  const btn=e.target.closest('.aux-btn');
  if(btn){{ e.preventDefault(); selectAuxButton(btn); }}
}});
const norm=s=>(s||'').trim().toLowerCase().replace(/\s+/g,' ');
function itemState(id){
 if(!state.items[id]) state.items[id]={score:0,wrong:0,seen:0,parts:{}};
 return state.items[id];
}
function save(){localStorage.setItem(KEY,JSON.stringify(state)); updateStats();}
function updateStats(){
 let mastered=0,learning=0,weak=0;
 VERBS.forEach(v=>{let s=itemState(v.id); if(s.score>=5)mastered++; else if(s.seen>0)learning++; if(s.wrong>=2 && s.score<5)weak++;});
 $('#sMastered').textContent=mastered; $('#sLearning').textContent=learning; $('#sWeak').textContent=weak; $('#sAnswered').textContent=state.answered||0;
 $('#bar').style.width=(mastered/VERBS.length*100).toFixed(1)+'%';
}
function chooseVerb(){
 if(exam && examQueue.length) return examQueue.shift();
 let pool=VERBS;
 if(weakOnly){
   let w=VERBS.filter(v=>{let s=itemState(v.id);return s.wrong>0||s.score<2});
   if(w.length) pool=w;
 }
 let weighted=[];
 pool.forEach(v=>{
   let s=itemState(v.id), weight=Math.max(1,7-s.score)+(s.wrong*2);
   for(let i=0;i<weight;i++) weighted.push(v);
 });
 return weighted[Math.floor(Math.random()*weighted.length)];
}
function qType(){
 if(currentType!=='mixed') return currentType;
 const a=['forms','forms','present','aux','meaning','reverse'];
 return a[Math.floor(Math.random()*a.length)];
}
function makeInput(name,label,placeholder=''){
 return `<div class="field"><label>${label}</label><input autocomplete="off" autocapitalize="none" data-name="${name}" placeholder="${placeholder}"></div>`;
}
function newQuestion(){
 current=chooseVerb(); if(!current){alert('Экзамен завершён!'); exam=false; return newQuestion();}
 let type=qType(); current._type=type;
 $('#feedback').classList.add('hidden'); $('#feedback').innerHTML='';
 $('#nextBtn').classList.add('hidden'); $('#checkBtn').classList.remove('hidden'); $('#dontKnowBtn').classList.remove('hidden');
 let fields='';
 if(type==='forms'){
   $('#prompt').textContent=current.infinitive; $('#promptHint').textContent='Дай imperfectum, participium и hulpwerkwoord';
   fields=makeInput('imperfectum','Imperfectum')+makeInput('participle','Participium')+
   `<div class="field"><label>Hulpwerkwoord</label>
<div class="aux-group" data-name="auxiliary">
  <button type="button" class="aux-btn" data-value="hebben" aria-pressed="false">hebben</button>
  <button type="button" class="aux-btn" data-value="zijn" aria-pressed="false">zijn</button>
  <button type="button" class="aux-btn" data-value="hebben / zijn" aria-pressed="false">hebben / zijn</button>
</div></div>`;
 } else if(type==='present'){
   $('#prompt').textContent=current.infinitive; $('#promptHint').textContent='Спряжение в tegenwoordige tijd';
   fields=makeInput('p_ik','ik')+makeInput('p_hij','hij / zij (ед.ч.)')+makeInput('p_wij','wij')+makeInput('p_zij','zij (мн.ч.)');
 } else if(type==='aux'){
   $('#prompt').textContent=current.infinitive+' → '+current.participle; $('#promptHint').textContent='Какой hulpwerkwoord используется в perfectum?';
   fields=`<div class="field"><label>Hulpwerkwoord</label>
<div class="aux-group" data-name="auxiliary">
  <button type="button" class="aux-btn" data-value="hebben" aria-pressed="false">hebben</button>
  <button type="button" class="aux-btn" data-value="zijn" aria-pressed="false">zijn</button>
  <button type="button" class="aux-btn" data-value="hebben / zijn" aria-pressed="false">hebben / zijn</button>
</div></div>`;
 } else if(type==='meaning'){
   $('#prompt').textContent=current.infinitive; $('#promptHint').textContent='Назови одно или несколько основных значений по-русски. Проверка — самопроверка.';
   fields=makeInput('meaning','Перевод');
 } else {
   $('#prompt').textContent=current.translation; $('#promptHint').textContent='Восстанови глагол и основные формы';
   fields=makeInput('infinitive','Infinitief')+makeInput('imperfectum','Imperfectum')+makeInput('participle','Participium')+
   `<div class="field"><label>Hulpwerkwoord</label>
<div class="aux-group" data-name="auxiliary">
  <button type="button" class="aux-btn" data-value="hebben" aria-pressed="false">hebben</button>
  <button type="button" class="aux-btn" data-value="zijn" aria-pressed="false">zijn</button>
  <button type="button" class="aux-btn" data-value="hebben / zijn" aria-pressed="false">hebben / zijn</button>
</div></div>`;
 }
 $('#fields').innerHTML=fields;
 setTimeout(()=>{let i=$('#fields input'); if(i)i.focus()},30);
}
function expected(name){
 if(name==='infinitive') return current.infinitive;
 if(name==='imperfectum') return current.imperfectum;
 if(name==='participle') return current.participle;
 if(name==='auxiliary') return current.auxiliary;
 if(name==='p_ik') return current.present.ik;
 if(name==='p_hij') return current.present.hij;
 if(name==='p_wij') return current.present.wij;
 if(name==='p_zij') return current.present.zij;
 if(name==='meaning') return current.translation;
}
function equivalent(got,exp,name){
 got=norm(got); exp=norm(exp);
 if(name==='auxiliary'){
   const gs=new Set(got.split('/').map(x=>x.trim()).filter(Boolean));
   const es=new Set(exp.split('/').map(x=>x.trim()).filter(Boolean));
   return gs.size===es.size && [...gs].every(x=>es.has(x));
 }
 if(exp.includes(' / ')) return exp.split(' / ').some(x=>norm(x)===got) || got===exp;
 return got===exp;
}
function check(forceWrong=false){
 let s=itemState(current.id), okAll=true, rows=[];
 document.querySelectorAll('#fields [data-name]').forEach(el=>{
   let name=el.dataset.name;
   let got = el.classList.contains('aux-group') ? (el.dataset.selected || '') : (el.value || '');
   let exp=expected(name), ok;
   if(name==='meaning') {
      ok = !forceWrong && got.trim().length>0; // self-check below
      rows.push(`<div class="row"><span class="${ok?'ok':'wrong'}">${ok?'Ответ введён':'Нет ответа'}</span><br>Правильные значения: <span class="answer">${exp}</span></div>`);
      if(!ok) okAll=false;
   } else {
      ok=!forceWrong && equivalent(got,exp,name);
      if(!ok) okAll=false;
      rows.push(`<div class="row"><span class="${ok?'ok':'wrong'}">${ok?'✓':'✗'} ${got?got:'—'}</span>${ok?'':` → <span class="answer">${exp}</span>`}</div>`);
      s.parts[name]=(s.parts[name]||0)+(ok?1:-1);
   }
 });
 s.seen++; state.answered++;
 if(okAll) s.score=Math.min(6,s.score+1); else {s.score=Math.max(0,s.score-2);s.wrong++;}
 rows.push(`<div class="row small">Семья: <b>${current.family}</b> · Значение: ${current.translation}<br>
 Tegenwoordige tijd: <b>ik ${current.present.ik}</b> · <b>hij/zij ${current.present.hij}</b> · <b>wij ${current.present.wij}</b> · <b>zij ${current.present.zij}</b><br>
 Imperfectum: <b>${current.imperfectum}</b> · Participium: <b>${current.participle}</b> · Hulpwerkwoord: <b>${current.auxiliary}</b></div>`);
 $('#feedback').innerHTML=rows.join(''); $('#feedback').classList.remove('hidden');
 $('#checkBtn').classList.add('hidden'); $('#dontKnowBtn').classList.add('hidden'); $('#nextBtn').classList.remove('hidden');
 save();
}
function renderLearn(){
 const q=norm($('#search')?.value||'');
 const byFamily=$('#groupFamily').classList.contains('active');
 const pf=$('#patternFilter')?.value||'';
 let list=VERBS.filter(v=>(!q||norm(JSON.stringify(v)).includes(q)) && (!pf||v.pattern_group===pf));
 if(byFamily){
   let groups={}; list.forEach(v=>(groups[v.pattern_group]??=[]).push(v));
   const keys=Object.keys(groups).sort((a,b)=>{
     const ia=PATTERN_ORDER.indexOf(a), ib=PATTERN_ORDER.indexOf(b);
     return (ia<0?999:ia)-(ib<0?999:ib)||a.localeCompare(b);
   });
   $('#learnList').innerHTML=keys.map(g=>`
    <div class="card"><div class="family">${g}</div>
    <div class="pattern-note">Одинаковая схема изменения основы. Составные глаголы наследуют модель базового глагола.</div>
    <table class="learn-table"><thead><tr><th>Infinitief</th><th>Imperfectum</th><th>Participium + hulpw.</th><th>Tegenwoordige tijd</th><th>Перевод</th></tr></thead><tbody>
    ${groups[g].sort((a,b)=>a.infinitive.localeCompare(b.infinitive)).map(v=>`<tr><td><b>${v.infinitive}</b><br><span class="pill">${v.family}</span></td><td>${v.imperfectum}</td><td>${v.participle} <span class="pill">${v.auxiliary}</span></td><td>ik ${v.present.ik}<br>hij/zij ${v.present.hij}<br>wij ${v.present.wij}<br>zij ${v.present.zij}</td><td>${v.translation}</td></tr>`).join('')}
    </tbody></table></div>`).join('');
 } else {
   list.sort((a,b)=>a.infinitive.localeCompare(b.infinitive));
   $('#learnList').innerHTML=`<div class="card"><table class="learn-table"><thead><tr><th>Infinitief</th><th>Imperfectum</th><th>Participium + hulpw.</th><th>Tegenwoordige tijd</th><th>Перевод</th></tr></thead><tbody>
   ${list.map(v=>`<tr><td><b>${v.infinitive}</b><br><span class="pill">${v.pattern_group}</span></td><td>${v.imperfectum}</td><td>${v.participle} <span class="pill">${v.auxiliary}</span></td><td>ik ${v.present.ik}<br>hij/zij ${v.present.hij}<br>wij ${v.present.wij}<br>zij ${v.present.zij}</td><td>${v.translation}</td></tr>`).join('')}
   </tbody></table></div>`;
 }
}
function setActiveTab(tabId){
 ['tabPractice','tabLearn','tabMeaning','tabWeak','tabExam'].forEach(id=>{
   const el=document.getElementById(id);
   if(el) el.classList.toggle('active', id===tabId);
 });
 const mobileMap={
   tabPractice:'mPractice',
   tabLearn:'mLearn',
   tabMeaning:'mMeaning',
   tabWeak:'mWeak',
   tabExam:'mExam'
 };
 ['mPractice','mLearn','mMeaning','mWeak','mExam'].forEach(id=>{
   const el=document.getElementById(id);
   if(el) el.classList.toggle('active', mobileMap[tabId]===id);
 });
}
function showPractice(label='Смешанная тренировка'){
 $('#practiceView').classList.remove('hidden');$('#learnView').classList.add('hidden');$('#meaningView').classList.add('hidden');$('#modeLabel').textContent=label; newQuestion();
}
$('#checkBtn').onclick=()=>check(false); $('#dontKnowBtn').onclick=()=>check(true); $('#nextBtn').onclick=newQuestion;
document.addEventListener('keydown',e=>{if(e.key==='Enter' && !$('#practiceView').classList.contains('hidden')){if(!$('#checkBtn').classList.contains('hidden')) check(false); else newQuestion();}});
document.querySelectorAll('.q').forEach(b=>b.onclick=()=>{document.querySelectorAll('.q').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentType=b.dataset.q;newQuestion();});
$('#tabPractice').onclick=()=>{setActiveTab('tabPractice');weakOnly=false;exam=false;showPractice('Смешанная тренировка')};
$('#tabWeak').onclick=()=>{setActiveTab('tabWeak');weakOnly=true;exam=false;showPractice('Только слабые и невыученные')};
$('#tabExam').onclick=()=>{setActiveTab('tabExam');weakOnly=false;exam=true;examQueue=[...VERBS].sort(()=>Math.random()-.5);currentType='reverse';document.querySelectorAll('.q').forEach(x=>x.classList.remove('active'));showPractice('Экзамен: каждый глагол по одному разу')};
$('#tabLearn').onclick=()=>{setActiveTab('tabLearn');$('#practiceView').classList.add('hidden');$('#meaningView').classList.add('hidden');$('#learnView').classList.remove('hidden');renderLearn()};
$('#tabMeaning').onclick=()=>{setActiveTab('tabMeaning');$('#practiceView').classList.add('hidden');$('#learnView').classList.add('hidden');$('#meaningView').classList.remove('hidden');newMeaningQuestion()};
$('#search').oninput=renderLearn;
$('#patternFilter').onchange=renderLearn;
$('#groupFamily').onclick=()=>{$('#groupFamily').classList.add('active');$('#groupAlpha').classList.remove('active');renderLearn()};
$('#groupAlpha').onclick=()=>{$('#groupAlpha').classList.add('active');$('#groupFamily').classList.remove('active');renderLearn()};
$('#resetBtn').onclick=()=>{if(confirm('Сбросить весь прогресс?')){localStorage.removeItem(KEY);state={items:{},answered:0};updateStats();newQuestion();}};
document.addEventListener('click', e=>{
  const btn=e.target.closest('#mPractice,#mLearn,#mMeaning,#mWeak,#mExam');
  if(!btn) return;
  e.preventDefault();
  const map={
    mPractice:'tabPractice',
    mLearn:'tabLearn',
    mMeaning:'tabMeaning',
    mWeak:'tabWeak',
    mExam:'tabExam'
  };
  const target=document.getElementById(map[btn.id]);
  if(target) target.click();
});
populatePatternFilter();
document.querySelectorAll('.meaning-dir').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.meaning-dir').forEach(x=>x.classList.remove('active'));
 b.classList.add('active'); meaningDirection=b.dataset.dir; newMeaningQuestion();
});
$('#meaningNext').onclick=newMeaningQuestion;
setActiveTab('tabPractice'); updateStats(); newQuestion();
if(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches){{
  document.documentElement.classList.add('standalone');
}}
</script>

<nav class="mobile-nav" aria-label="Навигация">
  <button id="mPractice">Тренировка</button>
  <button id="mLearn">Учить</button>
  <button id="mMeaning">Значения</button>
  <button id="mWeak">Слабые</button>
  <button id="mExam">Экзамен</button>
</nav>
</body></html>
